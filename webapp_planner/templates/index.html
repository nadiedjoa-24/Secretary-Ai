<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Choix du mois</title>
</head>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-OK8tI+1rYuoB5+0PE2xWeJsJ5V7lH+2wv+di6lE9mlE6OJ5uM0VgPc7SZyNBTXmq"
    crossorigin="anonymous"
  >
  <style>
    /* Page background */
    body {
      background-color: #f8f9fa;
    }

    /* Central container styling */
    .container {
      background-color: #ffffff;
      padding: 2rem;
      border-radius: 0.5rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    /* Heading style */
    h1 {
      color: #343a40;
      font-weight: 600;
    }

    /* Form inputs */
    .form-control {
      max-width: 100px;
    }

    /* Select inputs */
    .form-select {
      max-width: 150px;
    }

    /* Buttons custom colors */
    .btn-primary {
      background-color: #0069d9;
      border-color: #0062cc;
    }
    .btn-primary:hover {
      background-color: #0053ba;
      border-color: #0041a8;
    }
    .btn-success {
      background-color: #28a745;
      border-color: #218838;
    }
    .btn-success:hover {
      background-color: #218838;
      border-color: #1e7e34;
    }

    /* Divider styling */
    hr {
      border-top: 1px solid #dee2e6;
    }
  </style>
</head>
</head>
<body>
<body>
  <div class="container mt-4 text-center">
    <h1 class="mb-4">Sélectionnez un mois</h1>
    <form action="/appointments" method="get" class="row g-3 justify-content-center align-items-center">
      <div class="col-auto">
        <label for="month-appt" class="col-form-label">Mois (1–12) :</label>
      </div>
      <div class="col-auto">
        <select id="month-appt" name="month" class="form-select">
          {% for i in range(1, 13) %}
            <option value="{{ i }}" {% if i == current_month %}selected{% endif %}>{{ i }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-primary">Voir rendez-vous</button>
      </div>
    </form>
    <hr class="my-4">
    <form action="/available" method="get" class="row g-3 justify-content-center align-items-center">
      <div class="col-auto">
        <label for="month-avail" class="col-form-label">Mois (1–12) :</label>
      </div>
      <div class="col-auto">
        <select id="month-avail" name="month" class="form-select">
          {% for i in range(1, 13) %}
            <option value="{{ i }}" {% if i == current_month %}selected{% endif %}>{{ i }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-auto">
        <button type="submit" class="btn btn-success">Voir créneaux libres</button>
      </div>
    </form>
  </div>
</body>
</html>
