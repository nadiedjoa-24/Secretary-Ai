name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the demo image
        run: docker build -t secretary-ai .

      - name: Start the demo and check that every page responds
        run: |
          docker run -d --name demo -p 8000:8000 -e AI_PROVIDER=groq -e GROQ_API_KEY=placeholder -e TTS_ENGINE=browser secretary-ai
          for i in $(seq 1 30); do curl -sf http://localhost:8000/ > /dev/null && break; sleep 1; done
          reschedule=$(curl -sf http://localhost:8000/planner/appointments | grep -o '/planner/reschedule/[0-9a-f]*' | head -n 1)
          for path in / /prescription /mail /planner/ /planner/appointments /planner/available "$reschedule"; do
            curl -sf "http://localhost:8000$path" > /dev/null || { echo "Failed: $path"; docker logs demo; exit 1; }
          done
