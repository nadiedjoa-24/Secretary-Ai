<!DOCTYPE html>
<html>

<head>
    <title>Réarranger les mails</title>
</head>

<body>
    <h1>Réarranger les mails</h1>
    {% if message %}
    <p style="color:green;">{{ message }}</p>
    {% endif %}
    {% for email in emails %}
    <div style="border:1px solid #ccc; margin:10px; padding:10px;">
        <b>Sujet :</b> {{ email.subject }}<br>
        <b>Expéditeur :</b> {{ email.sender }}<br>
        <b>Date :</b> {{ email.date }}<br>
        <b>Contenu :</b> {{ email.content }}<br>
        <form method="post">
            <input type="hidden" name="email_id" value="{{ email.id }}">
            <label>Souhaitez-vous déplacer ce mail ?</label>
            <select name="target_folder">
                {% for folder in folders %}
                <option value="{{ folder }}">{{ folder }}</option>
                {% endfor %}
            </select>
            <button type="submit">Déplacer</button>
        </form>
    </div>
    {% endfor %}
</body>

</html>
