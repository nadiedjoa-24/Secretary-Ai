services:
  - type: web
    name: secretary-ai
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "1"
      - key: AI_REQUESTS_PER_HOUR
        value: "30"
      - key: TTS_ENGINE
        value: openai
