<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planning</title>
</head>

<body>
    <h1>Planning des Rendez-vous</h1>
    <h2>Liste des Rendez-vous</h2>
    <ul id="planning-list"></ul>

    <h2>Créneaux Disponibles</h2>
    <ul id="creneaux-list"></ul>

    <h2>Chat avec l'Assistant</h2>
    <div id="chatbox">
        <div id="messages" style="border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll;"></div>
        <input type="text" id="user-input" placeholder="Écrivez votre message..." style="width: 80%;">
        <button id="send-button">Envoyer</button>
    </div>

    <script>
        async function fetchPlanning() {
            const response = await fetch("http://127.0.0.1:8000/planning");
            const planning = await response.json();

            const ul = document.getElementById("planning-list");
            ul.innerHTML = ""; // Clear existing content

            planning.forEach(rdv => {
                const li = document.createElement("li");
                li.textContent = `${rdv.date_heure} - ${rdv.titre} pour ${rdv.participant.nom} avec ${rdv.Practicien}`;
                ul.appendChild(li);
            });
        }

        async function fetchCreneauxDisponibles() {
            const debut = "2025-04-20T08:00:00";
            const fin = "2025-04-20T18:00:00";
            const duree_minutes = 30;

            const response = await fetch(`http://127.0.0.1:8000/creneaux-disponibles?debut=${debut}&fin=${fin}&duree_minutes=${duree_minutes}`);
            const creneaux = await response.json();

            const ul = document.getElementById("creneaux-list");
            ul.innerHTML = ""; // Clear existing content

            creneaux.forEach(creneau => {
                const li = document.createElement("li");
                li.textContent = `De ${creneau.debut} à ${creneau.fin}`;
                ul.appendChild(li);
            });
        }

        const messagesDiv = document.getElementById("messages");
        const userInput = document.getElementById("user-input");
        const sendButton = document.getElementById("send-button");

        async function sendMessage() {
            const userMessage = userInput.value;
            if (!userMessage) return;

            // Afficher le message de l'utilisateur
            const userMessageDiv = document.createElement("div");
            userMessageDiv.textContent = `Vous : ${userMessage}`;
            messagesDiv.appendChild(userMessageDiv);

            // Appeler l'API FastAPI pour interagir avec OpenAI
            try {
                const response = await fetch("http://127.0.0.1:8000/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ message: userMessage }),
                });
                const data = await response.json();

                // Afficher la réponse de l'assistant
                const assistantMessageDiv = document.createElement("div");
                if (data.response) {
                    assistantMessageDiv.textContent = `Assistant : ${data.response}`;
                } else {
                    assistantMessageDiv.textContent = "Erreur : Impossible de contacter l'assistant.";
                }
                messagesDiv.appendChild(assistantMessageDiv);
            } catch (error) {
                const errorDiv = document.createElement("div");
                errorDiv.textContent = "Erreur : " + error.message;
                messagesDiv.appendChild(errorDiv);
            }

            // Nettoyer le champ de saisie
            userInput.value = "";
            messagesDiv.scrollTop = messagesDiv.scrollHeight; // Scroll vers le bas
        }

        sendButton.addEventListener("click", sendMessage);
        userInput.addEventListener("keypress", function (e) {
            if (e.key === "Enter") sendMessage();
        });

        // Charger les données au chargement de la page
        fetchPlanning();
        fetchCreneauxDisponibles();
    </script>
</body>

</html>
